name: Mirror REA source into this repository

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mirror-rea-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Sync upstream REA source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/morluto/rea.git "$RUNNER_TEMP/rea"
          UPSTREAM_SHA="$(git -C "$RUNNER_TEMP/rea" rev-parse HEAD)"
          mkdir -p vendor/rea
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.turbo/' \
            --exclude='dist/' \
            --exclude='build/' \
            "$RUNNER_TEMP/rea/" vendor/rea/
          printf '%s\n' "$UPSTREAM_SHA" > vendor/rea/UPSTREAM_COMMIT.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/rea
          if git diff --cached --quiet; then
            echo "vendor/rea already matches upstream commit $UPSTREAM_SHA"
            exit 0
          fi
          git commit -m "Mirror REA source snapshot $UPSTREAM_SHA"
          git push origin HEAD:main
