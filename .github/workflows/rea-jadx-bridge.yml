name: Package REA JADX bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rea-jadx-bridge.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/rea-jadx-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and verify REA-pinned JADX bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/rea-jadx-headless-mcp
          JAR=dist/rea-jadx-headless-mcp/jadx-headless-mcp-0.7.1-all.jar
          curl -fsSL --retry 3 "https://github.com/1013503897/jadx-headless-mcp/releases/download/v0.7.1/jadx-headless-mcp-0.7.1-all.jar" -o "$JAR"
          echo "6e5eacf500b64292bfb73c49797c1958f6ee44646e43e868039ae7feb573ff75  $JAR" | sha256sum -c -
          curl -fsSL --retry 3 "https://raw.githubusercontent.com/1013503897/jadx-headless-mcp/5844800a486d2248fa949b74c9896285f5b54de2/LICENSE" -o dist/rea-jadx-headless-mcp/LICENSE-APACHE-2.0.txt
          echo "SHA-256 verified: $(sha256sum "$JAR" | cut -d ' ' -f1)"
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: rea-jadx-headless-mcp-0.7.1
          path: dist/rea-jadx-headless-mcp/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
